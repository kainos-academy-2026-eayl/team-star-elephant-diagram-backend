name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test and build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  push-image:
    name: Push image to ACR
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_LOGIN_SERVER/backend:$ENVIRONMENT-$GITHUB_SHA"
          docker build --target runtime -t "$IMAGE" .
          docker push "$IMAGE"
      
      - name: Ensure postgres image exists in ACR
        run: |
          if ! docker manifest inspect "$ACR_LOGIN_SERVER/postgres:17-alpine" >/dev/null 2>&1; then
            docker pull --platform linux/amd64 postgres:17-alpine
            docker tag postgres:17-alpine "$ACR_LOGIN_SERVER/postgres:17-alpine"
            docker push "$ACR_LOGIN_SERVER/postgres:17-alpine"
          fi

  terraform-deploy:
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: my-infrastructure
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: dev
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_backend_image_tag: ${{ vars.BACKEND_IMAGE_TAG }}
      TF_VAR_frontend_image_tag: ${{ vars.FRONTEND_IMAGE_TAG }}
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - uses: actions/checkout@v4

      - name: Check image tags
        run: |
          if [ -z "$TF_VAR_backend_image_tag" ] || [ -z "$TF_VAR_frontend_image_tag" ]; then
            echo "::error::Set BACKEND_IMAGE_TAG and FRONTEND_IMAGE_TAG as repository variables."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
  
      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=backend-${ENVIRONMENT}.tfstate"
  
      - name: Terraform Validate
        run: terraform validate
  
      - name: Terraform Plan
        run: |
          echo "Planning $ENVIRONMENT against backend-${ENVIRONMENT}.tfstate"
          terraform plan -input=false -no-color -var-file="${ENVIRONMENT}.tfvars" -out=tfplan

      - name: Publish plan to job summary
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan being applied: \`$ENVIRONMENT\` (\`backend-${ENVIRONMENT}.tfstate\`)"
            echo
            echo "**$(grep -E '^(Plan:|No changes)' plan.txt || echo 'See full plan below.')**"
            echo
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
  
      - name: Terraform Apply
        run: terraform apply -input=false tfplan