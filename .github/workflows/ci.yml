name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Container Build
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          docker build \
            --target runtime \
            --tag "team-star-elephant-backend:${GIT_SHA}" \
            .
  plan:
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: my-infrastructure
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ENVIRONMENT: dev
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_backend_image_tag: ${{ vars.BACKEND_IMAGE_TAG }}
      TF_VAR_frontend_image_tag: ${{ vars.FRONTEND_IMAGE_TAG }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Check image tags
        run: |
          if [ -z "$TF_VAR_backend_image_tag" ] || [ -z "$TF_VAR_frontend_image_tag" ]; then
            echo "::error::Set BACKEND_IMAGE_TAG and FRONTEND_IMAGE_TAG as repository variables."
            exit 1
          fi
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=backend-${ENVIRONMENT}.tfstate"
      - name: Terraform Plan
        run: |
          echo "Planning $ENVIRONMENT against backend-${ENVIRONMENT}.tfstate"
          terraform plan -input=false -no-color -var-file="${ENVIRONMENT}.tfvars" -out=tfplan
      - name: Render plan
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan: \`$ENVIRONMENT\` (\`backend-${ENVIRONMENT}.tfstate\`)"
            echo
            echo "**$(grep -E '^(Plan:|No changes)' plan.txt || echo 'See full plan below.')**"
            echo
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo
            echo '```'
            echo "</details>"
            echo
            echo "_Commit ${GITHUB_SHA::7}, run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
          } > plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file plan.md --edit-last --create-if-none
